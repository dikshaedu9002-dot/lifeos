
name: LifeOS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Check LifeOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Check Backend Syntax
        run: node --check server/server.js

      - name: Check Backend Routes
        run: |
          node --check server/routes/authRoutes.js
          node --check server/routes/expenseRoutes.js
